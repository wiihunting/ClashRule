# 自定义 YouTube 规则
# 来源：shadowrocket_202609.conf
# 生成日期：2026-09-12
# 说明：原始备注全部保留
# 说明：UDP 拦截规则已从 Ban 类别移回 YouTube 类别

payload:
  # YouTube 核心域名
  - AND,((DOMAIN-SUFFIX,googlevideo.com),(NETWORK,UDP))
  - AND,((DOMAIN,youtubei.googleapis.com),(NETWORK,UDP))
  - DOMAIN-SUFFIX,video.google.com
  - DOMAIN-SUFFIX,youtu.be
  - DOMAIN-SUFFIX,yt.be
  - DOMAIN-SUFFIX,ytimg.com
  - DOMAIN-KEYWORD,youtube
