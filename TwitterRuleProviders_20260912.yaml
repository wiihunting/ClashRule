# Twitter 规则引用清单
# 生成日期：2026-09-12
# 用法：把 rule-providers 下的内容合并到 FlClash 主配置的 rule-providers
# 说明：原始备注全部保留
# 说明：自定义规则改用 GitHub Raw 地址引用

rule-providers:
  # 代理规则 (自动选择 / AI / TWITTER / OnDemand)
  # 本文件只包含其中 TWITTER 的自定义规则
  Twitter_Custom:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/wiihunting/ClashRule/main/Clash_Twitter_20260912.yaml
    path: ./ruleset/Twitter_Custom.yaml
    interval: 86400

  # Twitter（blackmatrix7）
  Twitter_Blackmatrix7:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.yaml
    path: ./ruleset/Twitter_Blackmatrix7.yaml
    interval: 86400
