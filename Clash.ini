[custom]
# 不要随意改变关键字，否则会导致出错
# 来源：stash2025V2.ini + shadowrocket_202609.conf
# 生成日期：2026-09-12
# 说明：保留 stash2025V2.ini 的全部规则，并补充 ClashRule 仓库中的自定义规则集
# 说明：Twitter 使用独立分组
# 说明：原 stash 的 Twitter20231006.list 已失效并删除，改用 blackmatrix7 Twitter 规则

# DNS 防泄露，必须最先匹配
ruleset=🧹 AdBlock,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/BlockHttpDNS/BlockHttpDNS.yaml

# 基础规则
# 局域网直连，放在最前，避免被代理或拦截规则抢先匹配
ruleset=🏠 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🏠 直连,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml

# 酒店登录弹窗，测试，必须优先于代理和拦截规则
ruleset=🏠 直连,[]IP-CIDR,1.1.1.3/32

# 广告拦截规则
ruleset=🧹 AdBlock,clash-classic:https://raw.githubusercontent.com/wiihunting/ClashRule/main/Clash_Ban.yaml
ruleset=🧹 AdBlock,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🧹 AdBlock,https://raw.githubusercontent.com/wiihunting/ClashRule/main/YihaoShequ.list

# AI 服务规则
ruleset=🤖 AI,clash-classic:https://raw.githubusercontent.com/wiihunting/ClashRule/main/Clash_AI.yaml
ruleset=🤖 AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list
ruleset=🤖 AI,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.yaml
ruleset=🤖 AI,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Anthropic/Anthropic.yaml
ruleset=🤖 AI,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.yaml

# Twitter 自定义与外部规则
ruleset=Twitter,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.yaml

# Google 和 Apple 规则
ruleset=🏠 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🖥️ Apple,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list

# Microsoft 规则
ruleset=Ⓜ️ Microsoft,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.yaml

# 自定义代理规则
# dash.cloudflare.com 必须先于 Direct 的 cloudflare.com
ruleset=🚀 选择节点,clash-classic:https://raw.githubusercontent.com/wiihunting/ClashRule/main/Clash_Proxy.yaml

# 其他代理规则
ruleset=🚀 选择节点,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.yaml

# 国内直连规则
ruleset=🏠 直连,clash-classic:https://raw.githubusercontent.com/wiihunting/ClashRule/main/Clash_Direct.yaml

# 流媒体和社交媒体外部规则
ruleset=📹 Youtube,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.yaml

# OnDemand 和 Nippon
ruleset=🚥 OnDemand,https://raw.githubusercontent.com/wiihunting/Shadowrocket/main/OnDemand.list
ruleset=🇯🇵 Nippon,https://raw.githubusercontent.com/wiihunting/Shadowrocket/main/Nippon.list

# 中国直连规则
ruleset=🏠 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🏠 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🏠 直连,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.yaml
ruleset=🏠 直连,clash-domain:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China_Domain.yaml
ruleset=🏠 直连,[]GEOIP,LAN
ruleset=🏠 直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

# 分组配置
custom_proxy_group=🚀 选择节点`select`[]⚙️ 自动选择`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇨🇳 台湾节点`[]🌏 世界各地`[]🔧 手动切换`[]DIRECT
custom_proxy_group=🔧 手动切换`select`.*
custom_proxy_group=⚙️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`240,,50
custom_proxy_group=🖥️ Apple`select`[]DIRECT`[]⚙️ 自动选择`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🔧 手动切换
custom_proxy_group=Ⓜ️ Microsoft`select`[]⚙️ 自动选择`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🔧 手动切换`[]DIRECT
custom_proxy_group=📹 Youtube`select`[]⚙️ 自动选择`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🌏 世界各地`[]🔧 手动切换`[]DIRECT
custom_proxy_group=🚥 OnDemand`select`[]🇭🇰 香港节点`[]⚙️ 自动选择`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇨🇳 台湾节点`[]🔧 手动切换`[]DIRECT
custom_proxy_group=🤖 AI`select`[]🇸🇬 狮城节点`[]🇨🇳 台湾节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]⚙️ 自动选择`[]🌏 世界各地`[]🔧 手动切换`[]DIRECT
custom_proxy_group=Twitter`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇭🇰 香港节点`[]⚙️ 自动选择`[]🔧 手动切换`[]DIRECT
custom_proxy_group=🇯🇵 Nippon`select`[]🇯🇵 日本节点`[]⚙️ 自动选择`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🔧 手动切换`[]DIRECT
custom_proxy_group=🏠 直连`select`[]DIRECT`[]⚙️ 自动选择`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🔧 手动切换
custom_proxy_group=🧹 AdBlock`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]⚙️ 自动选择`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🔧 手动切换`[]DIRECT

# 节点选择器
custom_proxy_group=🇭🇰 香港节点`url-test`(港|HK|hk|Hong Kong|HongKong|hongkong)`http://www.gstatic.com/generate_204`240,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|[^-]日|JP|Japan)`http://www.gstatic.com/generate_204`240,,50
custom_proxy_group=🇸🇬 狮城节点`url-test`(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`240,,50
custom_proxy_group=🇺🇲 美国节点`url-test`(美|US|United States)`http://www.gstatic.com/generate_204`240,,50
custom_proxy_group=🇨🇳 台湾节点`url-test`(台|TW)`http://www.gstatic.com/generate_204`240,,50
custom_proxy_group=🌏 世界各地`url-test`(^(?!.*(港|HK|hk|Hong Kong|HongKong|hongkong|日本|[^-]日|JP|Japan|新加坡|坡|狮城|SG|Singapore|美|US|United States|台|TW)).*)`http://www.gstatic.com/generate_204`240,,50

enable_rule_generator=true
overwrite_original_rules=true
