# YouTube 规则引用清单
# 生成日期：2026-09-12
# 用法：把 rule-providers 下的内容合并到 FlClash 主配置的 rule-providers
# 说明：原始备注全部保留
# 说明：自定义规则已删除，本文件只有外部规则

rule-providers:
  # YouTube 外部规则（自定义核心规则已删除，5 条全部被本列表覆盖）
