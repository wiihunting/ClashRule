# 自动代理规则引用清单
# 生成日期：2026-09-12
# 用法：把 rule-providers 下的内容合并到 FlClash 主配置的 rule-providers
# 说明：原始备注全部保留
# 说明：OnDemand、Nippon 为独立类别，不并入本文件
# 说明：自定义规则改用 GitHub Raw 地址引用

rule-providers:
  # 代理规则 (自动选择 / AI / TWITTER / OnDemand)
  # 本文件只包含其中“自动选择”的规则
  Proxy_Auto:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/wiihunting/ClashRule/main/Clash_Proxy_20260912.yaml
    path: ./ruleset/Proxy_Auto.yaml
    interval: 86400

  # Custom Proxy
  # GitHub
  # RULE-SET，策略为自动选择
  Proxy_Google:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.yaml
    path: ./ruleset/Proxy_Google.yaml
    interval: 86400

  # proxy RULE-SET
  Proxy_Microsoft:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.yaml
    path: ./ruleset/Proxy_Microsoft.yaml
    interval: 86400
