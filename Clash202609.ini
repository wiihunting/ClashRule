[custom]
# 不要随意改变关键字，否则会导致出错
# 来源：shadowrocket_202609.conf
# 生成日期：2026-09-12
# 说明：规则顺序尽量保持原配置顺序；自定义规则使用内联规则，外部列表使用引用

# DNS 防泄露，参考https://github.com/LingJingMaster/Shadowrocket-Rules
ruleset=REJECT,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/BlockHttpDNS/BlockHttpDNS.yaml

# Tailscale
# 按用户要求暂不启用 Tailscale，以下规则仅保留原始备注
# DOMAIN-SUFFIX,tailscale.com,自动选择,extended-matching
# DOMAIN-SUFFIX,ts.net,TAILSCALE
# IP-CIDR,100.64.0.0/10,TAILSCALE,no-resolve

# 酒店登录弹窗，测试
ruleset=DIRECT,[]IP-CIDR,1.1.1.3/32

#  - - - - - - - - - - - - - - -
# 自定义规则
# 直连规则 (DIRECT)
# 机场订阅
ruleset=DIRECT,[]DOMAIN-SUFFIX,todust.cc
# 证书吊销状态查询（OCSP）- 必须直连以保障握手速度
ruleset=DIRECT,[]DOMAIN-SUFFIX,digicert.com
# > 腾讯云对象存储（资源分发，必须直连以保证加载速度）
ruleset=DIRECT,[]DOMAIN-SUFFIX,tencentcos.cn
# > 阿里移动调度中心 必须直连保障手淘、闲鱼启动速度
ruleset=DIRECT,[]IP-CIDR,47.246.103.0/24,no-resolve
ruleset=DIRECT,[]IP-CIDR,203.119.144.0/20,no-resolve
ruleset=DIRECT,[]IP-CIDR,106.11.0.0/16,no-resolve
ruleset=DIRECT,[]DOMAIN-SUFFIX,alibabachengdun.com
# > NTP 官方时间服务池直连
ruleset=DIRECT,[]DOMAIN-SUFFIX,ntp.org
ruleset=DIRECT,[]DOMAIN,ntp.nasa.gov
# CDN服务，将 Fastly 核心节点全部直连
ruleset=DIRECT,[]DOMAIN-SUFFIX,fastly-edge.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,fastly.net
ruleset=DIRECT,[]DOMAIN-SUFFIX,fastlylb.net
# 喷梯网直连（保障国内网站加载速度）
ruleset=DIRECT,[]DOMAIN-SUFFIX,dapenti.com
# 途虎养车官方网站、App 数据同步与静态资源直连（保障国内服务访问速度）
ruleset=DIRECT,[]DOMAIN-SUFFIX,tuhu.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,tuhu.org
# 群晖（Synology）官方主站、QuickConnect 与 DSM 系统服务直连（保障 NAS 远程连接与套件下载速度）
ruleset=DIRECT,[]DOMAIN-SUFFIX,synology.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,synology.cn
# jsDelivr 开源 CDN 及相关核心/节点域名直连（保障全套服务与静态资源加载）
ruleset=DIRECT,[]DOMAIN-SUFFIX,jsdelivr.net
ruleset=DIRECT,[]DOMAIN-SUFFIX,jsdelivr.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,jsdmirror.com
# 中国石油（PetroChina）客服及加油 App 官方接口直连
ruleset=DIRECT,[]DOMAIN-SUFFIX,95504.net
ruleset=DIRECT,[]DOMAIN-SUFFIX,kunlunjyk.com
# 钱迹, 直连
ruleset=DIRECT,[]DOMAIN-SUFFIX,qianjiapp.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,qianji.app
ruleset=DIRECT,[]DOMAIN-SUFFIX,litangkj.com
# ZA, 直连
ruleset=DIRECT,[]DOMAIN-SUFFIX,za.group
ruleset=DIRECT,[]DOMAIN-SUFFIX,zajourney.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,zaticdn.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,zainvest.group
# （小众软件，黄集伟）, 直连
ruleset=DIRECT,[]DOMAIN-SUFFIX,appinn.me
ruleset=DIRECT,[]DOMAIN-SUFFIX,www.huangjiwei.com

# 拦截规则 (REJECT)
# 屏蔽网址
# > 谷歌广告与用户行为追踪限制 (Firebase Analytics)
ruleset=REJECT,[]DOMAIN-SUFFIX,app-measurement.com
# > 第三方移动应用行为统计与分析拦截
ruleset=REJECT,[]DOMAIN-SUFFIX,app-analytics-services.com
# 拦截 AppsFlyer 及其所有子域名
ruleset=REJECT,[]DOMAIN-SUFFIX,appsflyersdk.com
ruleset=REJECT,[]DOMAIN-SUFFIX,appsflyer.com
# 中币加密货币
ruleset=REJECT,[]DOMAIN-KEYWORD,zbstatic
ruleset=REJECT,[]DOMAIN-SUFFIX,zbstatic5.com
# 软件报错平台
ruleset=REJECT,[]DOMAIN-SUFFIX,ingest.sentry.io
# Firebase / Crashlytics 崩溃日志与追踪上报拦截
ruleset=REJECT,[]DOMAIN-SUFFIX,crashlytics.com
# Facebook个人信息
ruleset=REJECT,[]DOMAIN-SUFFIX,ep2.facebook.com

# 代理规则 (自动选择 / AI / TWITTER / OnDemand)
# Gemini地址定位
ruleset=AI,[]DOMAIN-SUFFIX,googleapis.com
ruleset=自动选择,[]DOMAIN-SUFFIX,githubusercontent.com
# > Feedly 核心同步域名强制走稳定代理
ruleset=自动选择,[]DOMAIN-SUFFIX,feedly.com
ruleset=自动选择,[]DOMAIN-SUFFIX,feedly.network
ruleset=自动选择,[]DOMAIN,cloud.feedly.com
# 将中国数字时代强制分流到 OnDemand 代理分组
# 该规则已加入 OnDemand 外部列表，不在此处重复
# DOMAIN-SUFFIX,chinadigitaltimes.net,OnDemand
