# Apple Podcasts 苹果播客专属特定 API 检索接口加速
ruleset=自动选择,[]DOMAIN,amp-api.podcasts.apple.com
ruleset=自动选择,[]DOMAIN,amp-api.media.apple.com
# 纽约时报（The New York Times）官方主站、短网址及 CDN 静态资源加速
ruleset=自动选择,[]DOMAIN-SUFFIX,nytimes.com
ruleset=自动选择,[]DOMAIN-SUFFIX,nyt.com
