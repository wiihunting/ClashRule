# 直连规则引用清单
# 生成日期：2026-09-12
# 用法：把 rule-providers 下的内容合并到 FlClash 主配置的 rule-providers
# 说明：原始备注全部保留
# 说明：自定义规则改用 GitHub Raw 地址引用

rule-providers:
  # 自定义规则
  # 直连规则 (DIRECT)
  Direct_Custom:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/wiihunting/ClashRule/main/Clash_Direct_20260912.yaml
    path: ./ruleset/Direct_Custom.yaml
    interval: 86400

  # Lan & Direct
  # 提取自 blackmatrix7 Lan.list 规则明细，全部设定为 DIRECT
  Direct_Lan:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml
    path: ./ruleset/Direct_Lan.yaml
    interval: 86400

  # 提取自 ACL4SSR Apple.list 规则明细 (Apple核心服务)
  Direct_Apple:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
    path: ./ruleset/Direct_Apple.yaml
    interval: 86400

  # China
  Direct_China:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.yaml
    path: ./ruleset/Direct_China.yaml
    interval: 86400

  # China_Domain
  Direct_China_Domain:
    type: http
    behavior: domain
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China_Domain.yaml
    path: ./ruleset/Direct_China_Domain.yaml
    interval: 86400
